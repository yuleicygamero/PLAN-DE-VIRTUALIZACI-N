# Plan de Virtualización 2026: Nginx reenvía /plan-virtualizacion/ a la app .NET (127.0.0.1:5180).
# Se instala en /etc/nginx/snippets/plan-virtualizacion.conf y se incluye desde el server{}
# HTTPS de n8n.americana.edu.co. Lo reescribe cada despliegue: no editar en el servidor.
#
# "^~" hace que ninguna otra regla del sitio (por ejemplo las de .php o archivos estáticos)
# atienda estas rutas: los archivos de la carpeta nunca se sirven directamente.
# Cada location declara su propio add_header para no heredar las cabeceras del sitio de n8n
# (la aplicación envía las suyas: CSP, X-Frame-Options, etc.).

location = /plan-virtualizacion {
    return 301 /plan-virtualizacion/;
}

# Misma ruta escrita con mayúscula.
location ^~ /Plan-virtualizacion {
    return 301 /plan-virtualizacion/;
}

# Tiempo real (SignalR / WebSocket).
location ^~ /plan-virtualizacion/hubs/ {
    proxy_pass http://127.0.0.1:5180;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location ^~ /plan-virtualizacion/ {
    proxy_pass http://127.0.0.1:5180;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
